name: Build FrameRoom Android
on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Testes Java PE + checagens de integração de código
        run: bash tools/test-all.sh
      - name: Localizar ou instalar Android command-line tools
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n1 || true)"
          if [[ -z "$SDKMANAGER" ]]; then
            mkdir -p "${ANDROID_HOME}/cmdline-tools/latest"
            curl --fail --location --silent --show-error \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
              -o "${RUNNER_TEMP}/android-cmdline-tools.zip"
            unzip -q "${RUNNER_TEMP}/android-cmdline-tools.zip" -d "${RUNNER_TEMP}/android-cmdline"
            cp -R "${RUNNER_TEMP}/android-cmdline/cmdline-tools/." "${ANDROID_HOME}/cmdline-tools/latest/"
            SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          "$SDKMANAGER" --version
      - name: Instalar Android SDK + NDK + CMake
        run: |
          set -o pipefail
          (yes | "$SDKMANAGER" --licenses || true) 2>&1 | tee -a build.log
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' 'cmake;3.22.1' 'ndk;27.0.12077973' 2>&1 | tee -a build.log
      - name: Compilar Bloodframe 2.0 MIT (fonte fixada)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build glslang-tools
          git clone --quiet https://github.com/ducvd89/bloodframe.git "$RUNNER_TEMP/bloodframe"
          git -C "$RUNNER_TEMP/bloodframe" checkout --quiet f4ac713aef58d9403a136e179b3b0d163d85eb66
          git -C "$RUNNER_TEMP/bloodframe" submodule update --init --recursive
          # Work around Vulkan format capability vs gralloc allocation mismatch,
          # observed on the Adreno 710: select upstream's copy-output transport.
          python3 tools/patch_bloodframe_ahb.py "$RUNNER_TEMP/bloodframe"
          NDK_DIR="$ANDROID_HOME/ndk/27.0.12077973"
          cmake -S "$RUNNER_TEMP/bloodframe/android" -B "$RUNNER_TEMP/bfbuild" -G Ninja \
            -DLSFG_SRC="$RUNNER_TEMP/bloodframe" \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_DIR/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-30 \
            -DANDROID_STL=c++_shared -DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/bfbuild" --target bloodframe -j 2
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp "$RUNNER_TEMP/bfbuild/libbloodframe.so" app/src/main/jniLibs/arm64-v8a/
          cp "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" app/src/main/jniLibs/arm64-v8a/
          test -s app/src/main/jniLibs/arm64-v8a/libbloodframe.so
          sha256sum app/src/main/jniLibs/arm64-v8a/libbloodframe.so | tee -a build.log
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compilar APK com log integral
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug :samplegame:assembleDebug --stacktrace 2>&1 | tee -a build.log
      - name: Verificar assinatura, ABI e conteúdo dos dois APKs
        shell: bash
        run: |
          set -o pipefail
          bash tools/verify-apks.sh 2>&1 | tee -a build.log
      - name: Enviar build.log mesmo se falhar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FrameRoom-r0.11-build-log
          path: build.log
          if-no-files-found: ignore
      - name: Enviar APK debug
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FrameRoom-r0.11-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Enviar APK do jogo de teste assinado junto com FrameRoom
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FrameRoom-r0.11-cooperative-demo-apk
          path: samplegame/build/outputs/apk/debug/samplegame-debug.apk
          if-no-files-found: error
