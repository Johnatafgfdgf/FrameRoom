name: Build FrameRoom Android
on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Testes Java PE + checagens de integração de código
        run: bash tools/test-all.sh
      - name: Localizar ou instalar Android command-line tools
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n1 || true)"
          if [[ -z "$SDKMANAGER" ]]; then
            mkdir -p "${ANDROID_HOME}/cmdline-tools/latest"
            curl --fail --location --silent --show-error \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
              -o "${RUNNER_TEMP}/android-cmdline-tools.zip"
            unzip -q "${RUNNER_TEMP}/android-cmdline-tools.zip" -d "${RUNNER_TEMP}/android-cmdline"
            cp -R "${RUNNER_TEMP}/android-cmdline/cmdline-tools/." "${ANDROID_HOME}/cmdline-tools/latest/"
            SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          "$SDKMANAGER" --version
      - name: Instalar Android SDK + NDK + CMake
        run: |
          set -o pipefail
          (yes | "$SDKMANAGER" --licenses || true) 2>&1 | tee -a build.log
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' 'cmake;3.22.1' 'ndk;27.0.12077973' 2>&1 | tee -a build.log
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compilar APK com log integral
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug --stacktrace 2>&1 | tee build.log
      - name: Enviar build.log mesmo se falhar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FrameRoom-r0.4-build-log
          path: build.log
          if-no-files-found: ignore
      - name: Enviar APK debug
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FrameRoom-r0.4-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
