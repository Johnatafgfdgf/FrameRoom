name: Build FrameRoom Android
on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Testes Java PE + checagens de integração de código
        run: bash tools/test-all.sh
      - uses: android-actions/setup-android@v3
      - name: Instalar Android SDK + NDK + CMake
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'cmake;3.22.1' 'ndk;27.0.12077973'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compilar APK com log integral
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug --stacktrace 2>&1 | tee build.log
      - name: Enviar build.log mesmo se falhar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FrameRoom-r0.4-build-log
          path: build.log
          if-no-files-found: ignore
      - name: Enviar APK debug
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FrameRoom-r0.4-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
